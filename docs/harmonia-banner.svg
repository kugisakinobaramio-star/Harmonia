<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Harmonia — find your sound</title>
  <desc id="desc">A colorful abstract music banner with glowing gradients, equalizer bars, and floating music notes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10152f"/>
      <stop offset=".52" stop-color="#35205f"/>
      <stop offset="1" stop-color="#0e5a70"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62e8d3"/>
      <stop offset=".48" stop-color="#8c7bff"/>
      <stop offset="1" stop-color="#ff7fc8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#9b83ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#9b83ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="1320" cy="70" r="370" fill="url(#glow)"/>
  <circle cx="180" cy="500" r="330" fill="url(#glow)"/>
  <g opacity=".15" fill="none" stroke="#fff">
    <path d="M0 110 C250 20 420 210 680 120 S1120 10 1600 130" stroke-width="2"/>
    <path d="M0 160 C250 70 420 260 680 170 S1120 60 1600 180" stroke-width="2"/>
    <path d="M0 210 C250 120 420 310 680 220 S1120 110 1600 230" stroke-width="2"/>
  </g>
  <g transform="translate(1080 112)">
    <g fill="url(#wave)">
      <rect x="0" y="125" width="22" height="115" rx="11"/>
      <rect x="38" y="82" width="22" height="200" rx="11"/>
      <rect x="76" y="34" width="22" height="296" rx="11"/>
      <rect x="114" y="102" width="22" height="160" rx="11"/>
      <rect x="152" y="0" width="22" height="365" rx="11"/>
      <rect x="190" y="72" width="22" height="220" rx="11"/>
      <rect x="228" y="118" width="22" height="130" rx="11"/>
      <rect x="266" y="54" width="22" height="255" rx="11"/>
      <rect x="304" y="100" width="22" height="165" rx="11"/>
      <rect x="342" y="135" width="22" height="95" rx="11"/>
    </g>
    <g fill="#fff" opacity=".8" font-family="Arial,sans-serif" font-size="42">
      <text x="-32" y="40">♪</text><text x="380" y="90">♫</text><text x="24" y="340">♬</text>
    </g>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#fff">
    <text x="112" y="220" font-size="108" font-weight="700" letter-spacing="-4">HARMONIA</text>
    <text x="120" y="285" font-size="31" fill="#d8d9ff" letter-spacing="5">FIND YOUR SOUND.</text>
    <rect x="120" y="340" width="360" height="5" rx="3" fill="url(#wave)"/>
    <text x="120" y="390" font-size="22" fill="#d6d7ee">Music discovery • Your library • Your listening space</text>
  </g>
</svg>