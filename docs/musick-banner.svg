<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">MusicKK — find your sound</title>
  <desc id="desc">A dark music player inspired banner with a mint green audio-waveform mark, luminous audio waveform and subtle equalizer bars.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d0a"/>
      <stop offset=".55" stop-color="#101b16"/>
      <stop offset="1" stop-color="#14271d"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5ffc8"/>
      <stop offset=".5" stop-color="#62f58a"/>
      <stop offset="1" stop-color="#20bd72"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#62f58a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#62f58a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="560" rx="36" fill="url(#background)"/>
