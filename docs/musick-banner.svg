    <rect x="88" y="40" width="24" height="380" rx="12"/>
    <rect x="132" y="130" width="24" height="200" rx="12"/>
    <rect x="176" y="0" width="24" height="450" rx="12"/>
    <rect x="220" y="92" width="24" height="275" rx="12"/>
    <rect x="264" y="160" width="24" height="145" rx="12"/>
    <rect x="308" y="65" width="24" height="335" rx="12"/>
    <rect x="352" y="125" width="24" height="210" rx="12"/>
