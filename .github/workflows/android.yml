name: Android APK

on:
  push:
    branches: [main]
    tags: ['android-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run lint

      - name: Build web app for Android
        run: npm run build
        env:
          VITE_API_BASE_URL: https://harmonia.kugisakinobaramio.workers.dev

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor assets and plugins
        run: npx cap sync android

      # Pull requests and ordinary branch builds remain debug-only.
      - name: Build installable debug APK
        if: "!startsWith(github.ref, 'refs/tags/android-v')"
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK for CI testing
        if: "!startsWith(github.ref, 'refs/tags/android-v')"
        uses: actions/upload-artifact@v4
        with:
          name: harmonia-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # A version tag is the only route to a public, stable APK release.
      # Configure all four ANDROID_* repository secrets before creating a tag.
      - name: Validate release signing secrets
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "::error::Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "::error::Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)

      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/harmonia-release.jks"
          chmod 600 "$RUNNER_TEMP/harmonia-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/harmonia-release.jks" >> "$GITHUB_ENV"
          VERSION_NAME="${GITHUB_REF_NAME#android-v}"
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must use android-vMAJOR.MINOR.PATCH (optional prerelease suffix)"
            exit 1
          fi
          echo "HARMONIA_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "HARMONIA_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Configure Android release signing and version
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: python3 scripts/configure-android-release.py

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew --no-daemon assembleRelease

      - name: Verify release APK signature
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Publish stable GitHub release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Harmonia v${{ env.HARMONIA_VERSION_NAME }}
          prerelease: false
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
