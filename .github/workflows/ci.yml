name: CI

on:
  push:
    branches: [main, "fix/**", "refine/**", "cloudflare/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx wrangler deploy --dry-run

      - name: Start local Workers runtime
        run: |
          (npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/wrangler.log 2>&1 & echo $! > /tmp/wrangler.pid)
      - name: Smoke test Cloudflare Worker API and static assets
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/music/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/wrangler.log
          grep -q '"ok":true' /tmp/health.json
          curl --fail --silent http://127.0.0.1:8787/ > /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
