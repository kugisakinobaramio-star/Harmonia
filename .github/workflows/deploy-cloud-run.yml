name: Deploy Harmonia to Cloud Run

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Configure the repository variable GCP_CLOUD_RUN_DEPLOY_ENABLED=true
# only after the Google Cloud identity and project variables below are ready.
jobs:
  deploy:
    if: ${{ vars.GCP_CLOUD_RUN_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE || 'harmonia' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Build and deploy the full-stack service
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID"
          test -n "$REGION"
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated \
            --quiet
